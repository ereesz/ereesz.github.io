<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админка — Миндаль (демо)</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f5efe6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5efe6;--bg2:#efe7db;--card:#fffdf9;--ink:#2a1215;--muted:#7d6a64;--line:#e6dacb;--accent:#7a1f2b;--on-accent:#fdf6ec;--chip:#faf6f0;--r:22px;--hf:"Cormorant Garamond",Georgia,serif;--bf:Inter,system-ui,sans-serif;--ok:#3bbf6a;--warn:#e8a33a;--bad:#d9534f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--bf);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
h1,h2{font-family:var(--hf);font-weight:400;letter-spacing:-.01em;text-transform:none;line-height:1.05}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;background:var(--accent);color:var(--on-accent);border:0;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
/* вход */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login form{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px;width:100%;max-width:360px;display:grid;gap:12px;text-align:center}
.login h1{font-size:34px}
.login p{color:var(--muted);font-size:13px}
input,select{width:100%;min-height:46px;border:1.5px solid var(--line);background:var(--chip);border-radius:12px;padding:0 12px}
input:focus,select:focus{outline:none;border-color:var(--accent)}
input.bad{border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* шапка */
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;height:60px}
.top h1{font-size:22px}
.top h1 small{font-family:var(--bf);font-size:12px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;margin-left:6px}
.top .acts{display:flex;gap:6px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
/* показатели */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-family:var(--hf);font-size:28px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.stat.new b{color:var(--accent)}
/* дни */
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.day{flex:none;width:60px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:6px 0;text-align:center;cursor:pointer;position:relative}
.day small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase}
.day b{font-size:19px}
.day i{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-style:normal;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.day.on{border-color:var(--accent);background:var(--chip);background:color-mix(in srgb,var(--accent) 16%,var(--card))}
.filters{display:flex;gap:6px;overflow-x:auto;margin:6px 0 14px;scrollbar-width:none}
.f{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 14px;min-height:38px;font-size:13px;font-weight:600;cursor:pointer}
.f.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* записи */
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 10px}
.dayhead h2{font-size:26px}
.dayhead span{font-size:13px;color:var(--muted)}
.list{display:grid;gap:8px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:62px 1fr;gap:4px 12px;position:relative}
.card.new{border-left-color:var(--accent)}
.card.ok{border-left-color:var(--ok)}
.card.done{border-left-color:var(--ok);padding:8px 14px;align-items:center;grid-template-columns:62px 1fr auto;background:var(--chip)}
.card.done .time{font-size:18px;grid-row:auto;color:var(--muted)}
.card.done .svc{font-weight:600;font-size:14px;color:var(--muted)}
.card.done .cacts{grid-column:auto;margin:0}
.undo{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;min-height:36px;padding:0 4px}
.badge.done{background:var(--ok);color:#fff}
.card.block{border-left-color:var(--muted);background:repeating-linear-gradient(135deg,var(--card) 0 10px,var(--chip) 10px 20px)}
.card.block .svc{color:var(--muted)}
.card.cancel{opacity:.45}
.card.cancel .svc{text-decoration:line-through}
.card.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.time{font-family:var(--hf);font-size:24px;line-height:1.1;grid-row:1/3}
.svc{font-weight:700}
.meta{font-size:13px;color:var(--muted)}
.meta a{font-weight:700;color:var(--ink);text-decoration:none}
.badge{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:2px}
.badge.new{background:var(--accent);color:var(--on-accent)}
.badge.ok{background:var(--ok);color:#fff}
.badge.cancel{background:var(--bad);color:#fff}
.cacts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:40px 16px;border:1.5px dashed var(--line);border-radius:var(--r)}
/* форма добавления */
dialog{border:0;border-radius:var(--r);background:var(--card);color:var(--ink);padding:22px;width:min(440px,calc(100% - 24px));margin:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog form{display:grid;gap:10px}
dialog h2{font-size:26px;margin-bottom:4px}
dialog .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
dialog label{font-size:12px;color:var(--muted);display:grid;gap:4px}
/* уведомление */
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,150%);background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 18px;font-weight:700;z-index:50;transition:transform .35s;max-width:calc(100% - 24px)}
.toast.on{transform:translate(-50%,0)}
.demo{background:var(--accent);color:var(--on-accent);font-size:12px;text-align:center;padding:7px 12px}
.demo a{font-weight:800}
.hidden{display:none!important}
@media (max-width:759px){
  .top{flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:10px;row-gap:8px}
  .live,.top h1 small{display:none}
}
@media (min-width:760px){
  .stats{grid-template-columns:repeat(4,1fr)}
  .card{grid-template-columns:70px 1fr auto;align-items:center}
  .time{grid-row:auto}
  .cacts{grid-column:auto;margin:0;justify-content:flex-end}
}
@media (prefers-reduced-motion:reduce){.card.flash,input.bad{animation:none}.toast{transition:none}}
</style>
</head>
<body>

<section class="login" id="login">
  <form id="loginForm">
    <h1>Миндаль<i>.</i></h1>
    <p>Вход для администратора</p>
    <input type="password" id="pass" placeholder="Пароль" autocomplete="current-password" autofocus>
    <button class="btn" type="submit">Войти</button>
    <p>Демо-пароль: <b>demo</b></p>
  </form>
</section>

<div id="app" class="hidden">
  <div class="demo">Демо-админка: записи с сайта появляются здесь сразу. <a href="./" target="_blank">Открыть сайт →</a></div>
  <header>
    <div class="wrap top">
      <h1>Миндаль<i>.</i><small>админка</small></h1>
      <div class="acts">
        <span class="live" id="live">онлайн</span>
        <button class="btn ghost sm" id="blockBtn" type="button">Закрыть время</button>
        <button class="btn sm" id="addBtn" type="button">+ Запись</button>
      </div>
    </div>
  </header>
  <main class="wrap">
    <div class="stats">
      <div class="stat new"><b id="sNew">0</b><span>новых, ждут звонка</span></div>
      <div class="stat"><b id="sToday">0</b><span>записей сегодня</span></div>
      <div class="stat"><b id="sMoney">0 ₽</b><span>выручка сегодня (план)</span></div>
      <div class="stat"><b id="sWeek">0</b><span>записей за 7 дней</span></div>
    </div>
    <div class="days" id="days"></div>
    <div class="filters" id="filters"></div>
    <div class="dayhead"><h2 id="dayTitle"></h2><span id="dayInfo"></span></div>
    <div class="list" id="list"></div>
    <p style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px 0 40px">
      <button class="btn ghost sm" id="demoBtn" type="button">Заполнить демо-записями</button>
      <button class="btn ghost sm" id="clearBtn" type="button">Очистить всё</button>
      <button class="btn ghost sm" id="logoutBtn" type="button">Выйти</button>
    </p>
  </main>
</div>

<dialog id="dlg">
  <form method="dialog" id="addForm">
    <h2>Новая запись</h2>
    <label>Услуга<select id="aSvc"></select></label>
    <label>Мастер<select id="aMaster"></select></label>
    <div class="row2"><label>Дата<input type="date" id="aDate" required></label><label>Время<select id="aTime"></select></label></div>
    <label>Имя клиента<input id="aName" required placeholder="Иван"></label>
    <label>Телефон<input id="aPhone" type="tel" required placeholder="+7 900 000-00-00"></label>
    <div class="row2"><button class="btn ghost" value="cancel" formnovalidate type="submit">Отмена</button><button class="btn" value="save" type="submit">Сохранить</button></div>
  </form>
</dialog>

<dialog id="dlgB">
  <form method="dialog" id="blockForm">
    <h2>Закрыть время</h2>
    <label>Причина<select id="bReason"><option>Перерыв</option><option>Выходной</option><option>Отпуск</option><option>Больничный</option><option>Другое</option></select></label>
    <label>Мастер<select id="bMaster"></select></label>
    <div class="row2"><label>С даты<input type="date" id="bDate" required></label><label>По дату<input type="date" id="bDateTo"></label></div>
    <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)"><input type="checkbox" id="bAll" style="width:20px;min-height:20px"> Весь день</label>
    <div class="row2" id="bTimes"><label>С<select id="bFrom"></select></label><label>До<select id="bTo"></select></label></div>
    <div class="row2"><button class="btn ghost" value="cancel" formnovalidate type="submit">Отмена</button><button class="btn" value="save" type="submit">Закрыть</button></div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
const DATA = {"slug": "mindal", "name": "Миндаль", "services": [{"cat": "Ногти", "name": "Маникюр с покрытием", "price": 2000, "min": 90, "quick": true, "from": false}, {"cat": "Ногти", "name": "Маникюр без покрытия", "price": 1000, "min": 45, "from": false, "quick": false}, {"cat": "Ногти", "name": "Педикюр с покрытием", "price": 2500, "min": 100, "quick": true, "from": false}, {"cat": "Ногти", "name": "Наращивание", "price": 3000, "min": 150, "from": true, "quick": false}, {"cat": "Волосы", "name": "Женская стрижка", "price": 1800, "min": 60, "quick": true, "from": false}, {"cat": "Волосы", "name": "Окрашивание в один тон", "price": 3500, "min": 120, "from": true, "quick": false}, {"cat": "Волосы", "name": "Сложное окрашивание", "price": 7000, "min": 240, "note": "цена зависит от длины", "from": true, "quick": false}, {"cat": "Брови и ресницы", "name": "Архитектура бровей", "price": 1200, "min": 40, "quick": true, "from": false}, {"cat": "Брови и ресницы", "name": "Ламинирование ресниц", "price": 2200, "min": 60, "from": false, "quick": false}, {"cat": "Брови и ресницы", "name": "Наращивание ресниц", "price": 2800, "min": 120, "from": false, "quick": false}, {"cat": "Уход", "name": "Чистка лица", "price": 3000, "min": 75, "from": false, "quick": false}, {"cat": "Уход", "name": "Массаж лица", "price": 2000, "min": 45, "from": false, "quick": false}], "masters": [{"name": "Алина", "role": "мастер маникюра", "cats": ["Ногти"], "bg": "linear-gradient(160deg,#a8434f,#5e1520)", "img": "img/master-alina.jpg"}, {"name": "Ксения", "role": "мастер маникюра", "cats": ["Ногти"], "bg": "linear-gradient(160deg,#c9a46a,#8a6a38)", "img": "img/master-kseniya.jpg"}, {"name": "Ольга", "role": "стилист-колорист", "cats": ["Волосы"], "bg": "linear-gradient(160deg,#8b5a63,#4a2229)", "img": "img/master-olga.jpg"}, {"name": "Дарья", "role": "бровист, лэшмейкер", "cats": ["Брови и ресницы"], "bg": "linear-gradient(160deg,#b98b78,#6e4636)", "img": "img/master-darya.jpg"}, {"name": "Вера", "role": "косметолог", "cats": ["Уход"], "bg": "linear-gradient(160deg,#7f9478,#3f5638)", "img": "img/master-vera.jpg"}], "open": 9, "close": 21, "half": true, "dayOff": [0], "heroImg": "img/hero.jpg", "works": [{"img": "img/work-manikyur.jpg", "t": "Френч с бордо"}, {"img": "img/work-okrashivanie.jpg", "t": "Балаяж, карамель"}, {"img": "img/work-brovi.jpg", "t": "Ламинирование бровей"}, {"img": "img/work-resnitsy.jpg", "t": "Классика, ресницы"}, {"img": "img/work-ukladka.jpg", "t": "Низкий пучок"}, {"img": "img/work-uhod.jpg", "t": "Уход за лицом"}]};
// Пароль администратора (у реального клиента — свой, а вход через Firebase)
const PASSWORD = "demo";
const KEY = DATA.slug + "_bookings";
const AUTH = DATA.slug + "_admin_ok";

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rub = n => n.toLocaleString("ru-RU").replace(/ /g, " ") + " ₽";
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const DAYN = ["вс","пн","вт","ср","чт","пт","сб"];
const MON = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const STATUS = { new: "новая", ok: "подтверждена", done: "сеанс окончен", cancel: "отмена" };
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
function save(a) { try { localStorage.setItem(KEY, JSON.stringify(a)); } catch (e) {} }
const BKEY = DATA.slug + "_blocks";
function loadBl() { try { return JSON.parse(localStorage.getItem(BKEY)) || []; } catch (e) { return []; } }
function saveBl(a) { try { localStorage.setItem(BKEY, JSON.stringify(a)); } catch (e) {} }
function getLS(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function setLS(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }

const slots = []; for (let h = DATA.open; h < DATA.close; h++) { slots.push(h + ":00"); if (DATA.half) slots.push(h + ":30"); }
const tmin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const today = new Date(); today.setHours(0, 0, 0, 0);
const days = [...Array(17)].map((_, i) => { const d = new Date(today); d.setDate(d.getDate() + i - 3); return d; });
let curDay = ymd(today), curMaster = "all", known = new Set(load().map(b => b.id)), flashIds = new Set();

/* ---------- вход ---------- */
function showApp() { $("#login").classList.add("hidden"); $("#app").classList.remove("hidden"); render(); }
if (getLS(AUTH) === "1") showApp();
$("#loginForm").onsubmit = e => {
  e.preventDefault();
  if ($("#pass").value === PASSWORD) { setLS(AUTH, "1"); showApp(); }
  else { const p = $("#pass"); p.classList.remove("bad"); void p.offsetWidth; p.classList.add("bad"); }
};
$("#logoutBtn").onclick = () => { setLS(AUTH, null); location.reload(); };

/* ---------- отрисовка ---------- */
function render() {
  const all = load();
  const t = ymd(today);
  const active = all.filter(b => b.status !== "cancel");
  $("#sNew").textContent = all.filter(b => b.status === "new").length;
  $("#sToday").textContent = active.filter(b => b.date === t).length;
  $("#sMoney").textContent = rub(active.filter(b => b.date === t).reduce((s, b) => s + b.price, 0));
  const wk = new Date(today); wk.setDate(wk.getDate() + 7);
  $("#sWeek").textContent = active.filter(b => b.date >= t && b.date < ymd(wk)).length;

  $("#days").innerHTML = "";
  days.forEach(d => {
    const k = ymd(d), n = all.filter(b => b.date === k && b.status === "new").length;
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "day" + (k === curDay ? " on" : "");
    const rel = k === t ? "сег" : DAYN[d.getDay()];
    btn.innerHTML = `<small>${rel}</small><b>${d.getDate()}</b>${n ? `<i>${n}</i>` : ""}`;
    btn.onclick = () => { curDay = k; render(); };
    $("#days").append(btn);
  });

  $("#filters").innerHTML = "";
  [["all", "Все мастера"], ...DATA.masters.map((m, i) => [String(i), m.name])].forEach(([v, label]) => {
    const b = document.createElement("button"); b.type = "button";
    b.className = "f" + (curMaster === v ? " on" : ""); b.textContent = label;
    b.onclick = () => { curMaster = v; render(); }; $("#filters").append(b);
  });

  const d = new Date(curDay + "T00:00");
  $("#dayTitle").textContent = `${d.getDate()} ${MON[d.getMonth()]}, ${["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"][d.getDay()]}`;
  const list = all.filter(b => b.date === curDay && (curMaster === "all" || String(b.master) === curMaster)).sort((a, b) => tmin(a.time) - tmin(b.time));
  const act = list.filter(b => b.status !== "cancel");
  $("#dayInfo").textContent = act.length ? `${act.length} зап. · ${rub(act.reduce((s, b) => s + b.price, 0))}` : "";

  const L = $("#list"); L.innerHTML = "";
  const blocks = loadBl().filter(x => curDay >= x.date && curDay <= (x.dateTo || x.date) && (curMaster === "all" || x.master === null || String(x.master) === curMaster));
  blocks.forEach(x => {
    const c = document.createElement("div"); c.className = "card block";
    const whole = x.from === slots[0] && tmin(x.to) >= DATA.close * 60;
    const range = x.dateTo && x.dateTo !== x.date ? ` · ${fmtD(x.date)} – ${fmtD(x.dateTo)}` : "";
    c.innerHTML = `<div class="time">${whole ? "весь<br>день" : esc(x.from)}</div><div><div class="svc">Закрыто: ${esc(x.reason)}</div><div class="meta">${x.master === null ? "все мастера" : esc(DATA.masters[x.master].name)}${whole ? "" : ` · ${esc(x.from)}–${esc(x.to)}`}${range}</div></div><div class="cacts"></div>`;
    const o = document.createElement("button"); o.type = "button"; o.className = "btn ghost sm"; o.textContent = "Открыть время";
    o.onclick = () => { saveBl(loadBl().filter(y => y.id !== x.id)); render(); toast("Время снова открыто для записи"); };
    c.querySelector(".cacts").append(o); L.append(c);
  });
  if (!list.length && blocks.length) return;
  if (!list.length) { L.innerHTML = `<div class="empty">На этот день записей нет.<br>Запишитесь на сайте или нажмите «+ Запись».</div>`; return; }
  list.forEach(b => {
    const c = document.createElement("div");
    if (b.status === "done") {
      // Сеанс окончен: строка сворачивается в одну линию
      c.className = "card done" + (flashIds.has(b.id) ? " flash" : "");
      const m = DATA.masters[b.master];
      c.innerHTML = `<div class="time">${esc(b.time)}</div><div class="svc">✓ ${esc(b.svc)} · ${esc(b.name)}<span class="badge done">сеанс окончен</span><span class="meta" style="margin-left:6px">${m ? esc(m.name) : ""} · ${rub(b.price)}</span></div><div class="cacts"></div>`;
      const u = document.createElement("button"); u.type = "button"; u.className = "undo"; u.textContent = "вернуть"; u.title = "Нажали случайно? Вернуть запись";
      u.onclick = () => setStatus(b.id, "ok"); c.querySelector(".cacts").append(u);
      L.append(c); return;
    }
    c.className = `card ${b.status}` + (flashIds.has(b.id) ? " flash" : "");
    const m = DATA.masters[b.master];
    c.innerHTML = `<div class="time">${esc(b.time)}</div>
      <div><div class="svc">${esc(b.svc)}<span class="badge ${b.status}">${STATUS[b.status]}</span></div>
      <div class="meta">${esc(b.name)} · <a href="tel:${esc(b.phone.replace(/[^\d+]/g, ""))}">${esc(b.phone)}</a></div>
      <div class="meta">${m ? esc(m.name) : "мастер не выбран"} · ${rub(b.price)} · ${b.min} мин${b.src === "site" ? " · с сайта" : b.src === "admin" ? " · по телефону" : ""}</div></div>
      <div class="cacts"></div>`;
    const A = c.querySelector(".cacts");
    const add = (label, fn, ghost) => { const x = document.createElement("button"); x.type = "button"; x.className = "btn sm" + (ghost ? " ghost" : ""); x.textContent = label; x.onclick = fn; A.append(x); };
    if (b.status === "new") add("Подтвердить", () => setStatus(b.id, "ok"));
    if (b.status === "ok" || b.status === "new") add("Готово ✓", () => { setStatus(b.id, "done"); toast(`Сеанс окончен: ${b.name}, ${b.svc}`); }, b.status === "new");
    if (b.status !== "cancel" && b.status !== "done") add("Отменить", () => setStatus(b.id, "cancel"), true);
    if (b.status === "cancel") add("Удалить", () => { save(load().filter(x => x.id !== b.id)); render(); }, true);
    L.append(c);
  });
  flashIds.clear();
}
function fmtD(k) { const d = new Date(k + "T00:00"); return d.getDate() + " " + MON[d.getMonth()]; }
function setStatus(id, s) { const a = load(); const b = a.find(x => x.id === id); if (b) { b.status = s; save(a); render(); } }

/* ---------- новые записи с сайта: появляются сами ---------- */
let audioCtx;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [880, 1320].forEach((f, i) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = f; g.gain.setValueAtTime(.15, audioCtx.currentTime + i * .15); g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + i * .15 + .3); o.connect(g).connect(audioCtx.destination); o.start(audioCtx.currentTime + i * .15); o.stop(audioCtx.currentTime + i * .15 + .3); });
  } catch (e) {}
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 4000); }
function checkNew() {
  const all = load(), fresh = all.filter(b => !known.has(b.id));
  all.forEach(b => known.add(b.id));
  if (!fresh.length) { render(); return; }
  fresh.forEach(b => flashIds.add(b.id));
  const b = fresh[fresh.length - 1], d = new Date(b.date + "T00:00");
  curDay = b.date;
  render(); beep();
  toast(`Новая запись: ${b.name}, ${b.svc}, ${d.getDate()} ${MON[d.getMonth()]} в ${b.time}`);
  document.title = `(${all.filter(x => x.status === "new").length}) Новая запись — ${DATA.name}`;
}
window.addEventListener("storage", e => { if (e.key === BKEY) render(); if (e.key === KEY && !$("#app").classList.contains("hidden")) checkNew(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) { document.title = `Админка — ${DATA.name} (демо)`; checkNew(); } });

/* ---------- ручное добавление (запись по телефону) ---------- */
$("#aSvc").innerHTML = DATA.services.map((s, i) => `<option value="${i}">${esc(s.name)} — ${rub(s.price)}</option>`).join("");
$("#aMaster").innerHTML = DATA.masters.map((m, i) => `<option value="${i}">${esc(m.name)}</option>`).join("");
$("#aTime").innerHTML = slots.map(t => `<option>${t}</option>`).join("");
$("#addBtn").onclick = () => { $("#aDate").value = curDay; $("#aName").value = ""; $("#aPhone").value = ""; $("#dlg").showModal(); };
$("#dlg").addEventListener("close", () => {
  if ($("#dlg").returnValue !== "save") return;
  const s = DATA.services[+$("#aSvc").value];
  const a = load(), id = Date.now().toString(36);
  a.push({ id, created: Date.now(), date: $("#aDate").value, time: $("#aTime").value, svc: s.name, price: s.price, min: s.min, master: +$("#aMaster").value, name: $("#aName").value.trim() || "Без имени", phone: $("#aPhone").value.trim(), status: "ok", src: "admin" });
  known.add(id); save(a); curDay = $("#aDate").value; render(); toast("Запись добавлена");
});

/* ---------- закрыть время ---------- */
$("#bMaster").innerHTML = `<option value="all">Все мастера</option>` + DATA.masters.map((m, i) => `<option value="${i}">${esc(m.name)}</option>`).join("");
const ends = [...slots.slice(1), DATA.close + ":00"];
$("#bFrom").innerHTML = slots.map(t => `<option>${t}</option>`).join("");
$("#bTo").innerHTML = ends.map(t => `<option>${t}</option>`).join("");
const syncAll = () => $("#bTimes").classList.toggle("hidden", $("#bAll").checked);
$("#bAll").onchange = syncAll;
$("#bReason").onchange = () => { $("#bAll").checked = $("#bReason").value !== "Перерыв"; syncAll(); };
$("#blockBtn").onclick = () => {
  $("#bReason").value = "Перерыв"; $("#bAll").checked = false; syncAll();
  $("#bMaster").value = curMaster; $("#bDate").value = curDay; $("#bDateTo").value = "";
  $("#bFrom").value = "13:00"; $("#bTo").value = "14:00";
  $("#dlgB").showModal();
};
$("#dlgB").addEventListener("close", () => {
  if ($("#dlgB").returnValue !== "save") return;
  const all = $("#bAll").checked;
  let from = all ? slots[0] : $("#bFrom").value, to = all ? DATA.close + ":00" : $("#bTo").value;
  if (tmin(to) <= tmin(from)) { toast("Время «до» должно быть позже «с»"); return; }
  const d1 = $("#bDate").value, d2 = $("#bDateTo").value && $("#bDateTo").value > d1 ? $("#bDateTo").value : null;
  const m = $("#bMaster").value === "all" ? null : +$("#bMaster").value;
  const a = loadBl(); a.push({ id: "b" + Date.now().toString(36), date: d1, dateTo: d2, from, to, master: m, reason: $("#bReason").value }); saveBl(a);
  curDay = d1; render(); toast("Время закрыто: на сайте на него больше не записаться");
});

/* ---------- демо-данные ---------- */
$("#demoBtn").onclick = () => {
  const names = ["Иван","Сергей","Алексей","Дмитрий","Максим","Андрей","Никита","Павел","Олег","Егор","Мария","Анна","Елена","Ольга","Дарья"];
  const a = load().filter(b => b.src !== "demo");
  for (let i = -3; i < 7; i++) {
    const d = new Date(today); d.setDate(d.getDate() + i);
    if (DATA.dayOff.includes(d.getDay())) continue;
    const used = new Set();
    for (let k = 0; k < 4 + Math.floor(Math.random() * 5); k++) {
      const t = slots[Math.floor(Math.random() * slots.length)];
      const s = DATA.services[Math.floor(Math.random() * DATA.services.length)];
      const ms = DATA.masters.map((x, i) => i).filter(i => !DATA.masters[i].cats || DATA.masters[i].cats.includes(s.cat));
      const m = ms[Math.floor(Math.random() * ms.length)];
      if (used.has(t + m)) continue; used.add(t + m);
      const status = i < 0 ? (Math.random() < .85 ? "done" : "cancel") : i === 0 ? (Math.random() < .15 ? "new" : "ok") : (Math.random() < .2 ? "new" : "ok");
      const id = "d" + i + "_" + k + "_" + Math.random().toString(36).slice(2, 6);
      known.add(id);
      a.push({ id, created: Date.now(), date: ymd(d), time: t, svc: s.name, price: s.price, min: s.min, master: m, name: names[Math.floor(Math.random() * names.length)], phone: "+7 900 " + String(Math.floor(100 + Math.random() * 899)) + "-" + String(Math.floor(10 + Math.random() * 89)) + "-" + String(Math.floor(10 + Math.random() * 89)), status, src: "demo" });
    }
  }
  save(a); render(); toast("Добавлены демо-записи");
};
$("#clearBtn").onclick = () => { save([]); saveBl([]); known = new Set(); render(); toast("Все записи удалены"); };
</script>
</body>
